# Mosquitto Configuration for MixSense
# Use this config to enable both TCP and WebSocket connections

# MQTT over TCP (for Node.js clients like mqtt-mock.js)
listener 1883
protocol mqtt

# MQTT over WebSockets (for browser/React app)
listener 9001
protocol websockets

# Allow connections without authentication (for development only)
allow_anonymous true

# Logging configuration
log_type error
log_type warning
log_type notice
log_type information
log_dest stdout

# Connection logging
connection_messages true

# Persistence
persistence true
persistence_location /tmp/mosquitto/

# Autosave interval (in seconds)
autosave_interval 1800
